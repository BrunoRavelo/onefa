<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario — ONEFA</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="onefa.css">
  <style>
    /* Botón volver — solo aquí */
    .btn-back {
      background: transparent;
      border: 1px solid rgba(255,255,255,.2); border-radius: 4px;
      color: rgba(255,255,255,.7); padding: .28rem .7rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .85rem; font-weight: 600; letter-spacing: 1px;
      text-decoration: none; transition: all .15s; display: inline-block;
    }
    .btn-back:hover { color: #fff; border-color: rgba(255,255,255,.5); }
  </style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-inner">
    <a class="brand" id="brandLink" href="index.html">
      <span class="brand-main">ONEFA</span>
      <span class="brand-sub">Pronósticos</span>
    </a>
    <div class="conf-tabs">
      <a class="conf-tab" id="tab14"  href="index.html">14 Grandes</a>
      <a class="conf-tab" id="tabNac" href="nacional.html">Nacional</a>
    </div>
    <div class="season-wrap">
      <div class="select-arrow-wrap">
        <select class="season-select" id="seasonSelect" onchange="cambiarTemp(this.value)"></select>
        <span class="select-arrow">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
    </div>
    <div class="nav-right">
      <a class="btn-back" id="btnBack" href="index.html">← Tabla</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-eye" id="heroEye">Calendario del equipo</div>
    <h1 class="hero-title" id="heroTitle">Cargando…</h1>
    <div class="hero-bar"></div>
  </div>
</header>

<main class="main-wrap">
  <div class="match-list" id="listaPartidos">
    <div class="empty-msg">Cargando…</div>
  </div>
  <div id="listaScrimmages"></div>
</main>

<script>
function getP(n) { return new URLSearchParams(window.location.search).get(n); }
const EQUIPO   = getP('equipo') || '';
const rawTemp  = getP('temporada');
const CONF     = getP('conferencia') || '14g';
const isNac    = CONF === 'nacional';
const TEMPORADA = rawTemp === '2025' ? 2025 : 2026;   // aplica igual a 14G y Nacional
const DATA_FILE = isNac ? `./onefa_nacional_${TEMPORADA}.json` : `./onefa_data_${TEMPORADA}.json`;
const SK        = isNac
  ? `onefa_nacional_${TEMPORADA}_v1`
  : (TEMPORADA===2025 ? 'onefa_juegos_v1' : `onefa_juegos_${TEMPORADA}_v1`);

// Nav
const backBase = isNac
  ? `nacional.html?temporada=${TEMPORADA}`
  : `index.html?temporada=${TEMPORADA}`;
document.getElementById('brandLink').href = backBase;
document.getElementById('btnBack').href   = backBase;
if (isNac) {
  document.getElementById('tabNac').classList.add('active');
  const s = document.getElementById('seasonSelect');
  s.innerHTML = '<option value="2026">2026</option><option value="2025">2025</option>';
  s.value = String(TEMPORADA);
} else {
  document.getElementById('tab14').classList.add('active');
  const s = document.getElementById('seasonSelect');
  s.innerHTML = '<option value="2026">2026</option><option value="2025">2025</option>';
  s.value = String(TEMPORADA);
}

function cambiarTemp(v) {
  const url = new URL(window.location.href);
  url.searchParams.set('temporada', v);
  window.location.href = url.toString();
}

let equipos=[], juegos=[], scrimmages=[], JORNADAS_JUGADAS=0;

async function cargarDatos() {
  try {
    const res = await fetch(DATA_FILE, { cache:'no-store' });
    const d   = await res.json();
    equipos = isNac ? Object.values(d.grupos||{}).flat() : (d.equipos||[]);
    juegos  = d.juegos || [];
    scrimmages = d.scrimmages || [];
    JORNADAS_JUGADAS = Number(d.jornadas_jugadas) || 0;
  } catch { equipos=[]; juegos=[]; scrimmages=[]; JORNADAS_JUGADAS=0; }

  // Los scrimmages solo se guardan en el JSON de la Conferencia Nacional.
  // Si estamos viendo un equipo de 14 Grandes, se piden aparte, ya que
  // varios equipos de 14G también jugaron partidos de preparación.
  if (!isNac) {
    try {
      const resN = await fetch(`./onefa_nacional_${TEMPORADA}.json`, { cache:'no-store' });
      const dN   = await resN.json();
      scrimmages = dN.scrimmages || [];
    } catch { /* sin scrimmages disponibles — no es crítico */ }
  }

  const toKey = g => `${g.jornada}#${g.local}#${g.visita}`;
  try {
    const raw = localStorage.getItem(SK);
    if (raw) {
      const ls=JSON.parse(raw), m=new Map(ls.map(g=>[toKey(g),g]));
      juegos=juegos.map(g=>{
        if((g.scoreLocal||0)+(g.scoreVisita||0)>0) return g;
        const s=m.get(toKey(g)); if(!s) return g;
        return{...g,scoreLocal:s.scoreLocal||0,scoreVisita:s.scoreVisita||0};
      });
    }
  } catch {}
  render();
}

function render() {
  const lista = document.getElementById('listaPartidos');
  const listaScrim = document.getElementById('listaScrimmages');
  if (!EQUIPO || !equipos.includes(EQUIPO)) {
    document.getElementById('heroTitle').textContent = 'Equipo no encontrado';
    lista.innerHTML = '<div class="empty-msg">No se encontró el equipo especificado.</div>';
    listaScrim.innerHTML = '';
    return;
  }
  const confLabel = isNac ? 'Conf. Nacional' : '14 Grandes';
  document.getElementById('heroEye').textContent = `${confLabel} ${TEMPORADA}`;
  document.getElementById('heroTitle').textContent = EQUIPO;
  document.title = `${EQUIPO} — ONEFA ${TEMPORADA}`;

  const partidos = juegos
    .filter(g => g.local===EQUIPO || g.visita===EQUIPO)
    .sort((a,b) => a.jornada - b.jornada);

  const scrimsEquipo = scrimmages.filter(g => g.local===EQUIPO || g.visita===EQUIPO);

  if (!partidos.length && !scrimsEquipo.length) {
    lista.innerHTML = '<div class="empty-msg">Sin partidos registrados para este equipo.</div>';
    listaScrim.innerHTML = '';
    return;
  }

  if (!partidos.length) {
    lista.innerHTML = '<div class="empty-msg">Sin partidos de temporada registrados para este equipo.</div>';
  } else {
    lista.innerHTML = '';
    partidos.forEach(p => {
      const esL   = p.local === EQUIPO;
      const rival = esL ? p.visita : p.local;
      const miPts = esL ? p.scoreLocal  : p.scoreVisita;
      const rvPts = esL ? p.scoreVisita : p.scoreLocal;
      const jugado = p.jornada <= JORNADAS_JUGADAS;
      const hasPts = (p.scoreLocal + p.scoreVisita) > 0;
      const gano   = hasPts && miPts > rvPts;
      const perdio = hasPts && miPts < rvPts;

      let cc = 'match-card';
      if (jugado && gano)   cc += ' ganado';
      else if (jugado && perdio) cc += ' perdido';
      else if (!jugado)     cc += ' pendiente';

      let badge = '';
      if (jugado && gano)   badge = '<span class="match-badge badge-win">Victoria</span>';
      else if (jugado && perdio) badge = '<span class="match-badge badge-loss">Derrota</span>';
      else if (!jugado)     badge = '<span class="match-badge badge-pend">Pendiente</span>';

      const jLabel = p.jornada===0 ? 'J0 · Apertura' : `Jornada ${p.jornada}`;
      const rLabel = esL ? 'Local' : 'Visita';

      let scoreHtml = '';
      if (hasPts) {
        const mc = gano ? 'won' : perdio ? 'lost' : '';
        scoreHtml = `<span class="${mc}">${EQUIPO} <span class="score">${miPts}</span> — <span class="score">${rvPts}</span> ${rival}</span>`;
      } else {
        scoreHtml = `${EQUIPO} vs ${rival}`;
      }

      lista.insertAdjacentHTML('beforeend', `
        <div class="${cc}">
          <div class="match-card-inner">
            <div>
              <div class="match-meta">${jLabel} · ${rLabel}</div>
              <div class="match-result">${scoreHtml}</div>
            </div>
            <div>${badge}</div>
          </div>
        </div>`);
    });
  }

  // Scrimmages: sección aparte, con color ámbar distintivo para no
  // confundirlos con los juegos de temporada regular.
  if (!scrimsEquipo.length) {
    listaScrim.innerHTML = '';
    return;
  }

  let scrimHtml = `
    <div class="scrim-section-label">Scrimmages
      <span class="scrim-section-sub">— juegos de preparación, no cuentan para la tabla</span>
    </div>
    <div class="match-list">`;

  scrimsEquipo.forEach(p => {
    const esL    = p.local === EQUIPO;
    const rival  = esL ? p.visita : p.local;
    const miPts  = esL ? p.scoreLocal  : p.scoreVisita;
    const rvPts  = esL ? p.scoreVisita : p.scoreLocal;
    const hasPts = (p.scoreLocal + p.scoreVisita) > 0;
    const gano   = hasPts && miPts > rvPts;
    const perdio = hasPts && miPts < rvPts;
    const rLabel = esL ? 'Local' : 'Visita';
    const nota   = p.nota ? ` <span class="tag-note">${p.nota}</span>` : '';

    let badge = '';
    if (gano)        badge = '<span class="match-badge badge-win">Victoria</span>';
    else if (perdio)  badge = '<span class="match-badge badge-loss">Derrota</span>';
    else if (hasPts)  badge = '<span class="match-badge badge-pend">Empate</span>';

    let scoreHtml = '';
    if (hasPts) {
      const mc = gano ? 'won' : perdio ? 'lost' : '';
      scoreHtml = `<span class="${mc}">${EQUIPO} <span class="score">${miPts}</span> — <span class="score">${rvPts}</span> ${rival}</span>`;
    } else {
      scoreHtml = `${EQUIPO} vs ${rival}`;
    }

    scrimHtml += `
      <div class="match-card scrim">
        <div class="match-card-inner">
          <div>
            <div class="match-meta">Scrimmage · ${rLabel}</div>
            <div class="match-result">${scoreHtml}${nota}</div>
          </div>
          <div>${badge}</div>
        </div>
      </div>`;
  });

  scrimHtml += `</div>`;
  listaScrim.innerHTML = scrimHtml;
}

cargarDatos();
</script>
</body>
</html>
